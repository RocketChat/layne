name: Release

on:
  push:
    branches: [develop, main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Create Version Packages PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: "chore: release"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retarget PR to main and update title with version
        if: steps.changesets.outputs.pullRequestNumber != '' && github.ref == 'refs/heads/develop'
        run: |
          git fetch origin changeset-release/develop
          VERSION=$(git show origin/changeset-release/develop:package.json | jq -r '.version')
          gh pr edit ${{ steps.changesets.outputs.pullRequestNumber }} \
            --base main \
            --title "chore: release v${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
