name: Sync main → develop

on:
  push:
    branches: [main]

jobs:
  sync:
    name: Open sync PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Create sync PR if main is ahead of develop
        run: |
          git fetch origin develop
          DIFF=$(git log origin/develop..origin/main --oneline)
          if [ -z "$DIFF" ]; then
            echo "develop is already in sync with main, nothing to do."
            exit 0
          fi

          EXISTING=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Sync PR #$EXISTING already exists."
            exit 0
          fi

          gh pr create \
            --base develop \
            --head main \
            --title "chore: sync main → develop" \
            --body "Automated sync of \`main\` into \`develop\` after a release. Merge this to keep \`develop\` up to date."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
