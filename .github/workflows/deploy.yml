name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << 'EOF'
Host deploy-target
  HostName ${{ secrets.EC2_HOST }}
  User ubuntu
  IdentityFile ~/.ssh/deploy_key
  StrictHostKeyChecking no
  UserKnownHostsFile /dev/null
EOF

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='coverage' \
            -e "ssh -F ~/.ssh/config" \
            ./ deploy-target:/home/ubuntu/layne/layne/

      - name: Write .env from secrets
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          DOMAIN: ${{ secrets.DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          {
            printf 'GITHUB_APP_ID=%s\n'          "$GH_APP_ID"
            printf 'GITHUB_APP_PRIVATE_KEY=%s\n' "$GH_APP_PRIVATE_KEY"
            printf 'GITHUB_WEBHOOK_SECRET=%s\n'  "$GH_WEBHOOK_SECRET"
            printf 'DOMAIN=%s\n'                 "$DOMAIN"
            printf 'LETSENCRYPT_EMAIL=%s\n'      "$LETSENCRYPT_EMAIL"
          } | ssh -F ~/.ssh/config deploy-target \
              'cat > /home/ubuntu/layne/layne/.env'

      - name: Rebuild and restart server and worker
        run: |
          ssh -F ~/.ssh/config deploy-target \
            'cd /home/ubuntu/layne/layne && docker compose up --build --no-deps -d server worker'
