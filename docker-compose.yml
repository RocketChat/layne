services:

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly yes — write every command to the AOF log so the queue
    # survives a container restart. appendfsync everysec balances durability
    # (at most 1 second of data loss) against write performance.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Webhook server ────────────────────────────────────────────────────────────
  # Receives GitHub webhook events and enqueues scan jobs.
  # Not exposed directly — nginx is the public entry point.
  server:
    build: .
    command: node src/server.js
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  # ── Worker ────────────────────────────────────────────────────────────────────
  # Processes scan jobs from the queue. Scale with --scale worker=N.
  worker:
    build: .
    command: node src/worker.js
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  # ── nginx ─────────────────────────────────────────────────────────────────────
  # TLS termination and reverse proxy. Serves ACME challenges for Certbot.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/certs:/etc/letsencrypt:ro
    depends_on:
      - server

  # ── Certbot ───────────────────────────────────────────────────────────────────
  # Certificate issuance and renewal. Run via scripts/init-tls.sh initially,
  # then on a cron/timer for renewals: docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/certs:/etc/letsencrypt

volumes:
  redis-data:
