# HTTP — redirect everything except ACME challenges to HTTPS
server {
    listen      80;
    server_name _;

    # Let Certbot answer ACME http-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy to the Layne webhook server
server {
    listen      443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/layne/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layne/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://server:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
